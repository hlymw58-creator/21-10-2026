<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الشافعي الصغير - اختبار إلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-image: url('https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w1920'); 
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1e293b;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .overlay {
            background: rgba(15, 23, 42, 0.85);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }

        .hidden-section { display: none !important; }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .option-btn {
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: #10b981;
            border-color: #34d399;
            color: #ffffff;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .question-text {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.6;
        }

        .timer-svg {
            transform: rotate(-90deg);
            width: 70px;
            height: 70px;
        }
        .timer-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 8;
        }
        .timer-circle-fg {
            fill: none;
            stroke: #facc15;
            stroke-width: 8;
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.5s;
        }

        .swal2-popup {
            font-family: 'Cairo', sans-serif !important;
            border-radius: 1rem !important;
        }
    </style>
</head>
<body class="p-4 sm:p-8 relative">
    <div class="overlay"></div>

    <div class="flex-grow flex flex-col items-center justify-center w-full z-10 relative">
        
        <!-- شاشة البداية -->
        <div id="intro-screen" class="glass-panel w-full max-w-2xl p-8 flex flex-col items-center text-center fade-in">
            <div class="w-32 h-32 mb-6 rounded-full border-4 border-yellow-500 shadow-[0_0_20px_rgba(234,179,8,0.4)] overflow-hidden bg-white flex items-center justify-center">
                <img src="https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w500" onerror="this.src='https://via.placeholder.com/150?text=Logo'" alt="اللوجو" class="w-full h-full object-cover">
            </div>
            
            <h1 class="text-3xl md:text-4xl font-bold mb-2 text-yellow-400">منصة الشافعي الصغير</h1>
            <h2 class="text-xl md:text-2xl font-semibold mb-8 text-gray-200">تحت إدارة أ. أبو بكر الشافعي</h2>
            
            <div class="w-full mb-6 text-right">
                <label for="student-name" class="block mb-2 font-bold text-lg text-gray-200">اسم الطالب ثلاثي:</label>
                <input type="text" id="student-name" placeholder="أدخل اسمك ثلاثي هنا..." class="w-full p-4 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-white/20 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 text-lg transition">
            </div>

            <div class="bg-blue-900/50 border border-blue-400/50 text-blue-100 px-4 py-3 rounded-lg mb-8 w-full flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                <span class="font-bold" id="attempts-info">لديك 6 محاولات فقط لاجتياز هذا الاختبار.</span>
            </div>

            <button onclick="confirmStartQuiz()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold text-2xl py-4 rounded-lg shadow-lg transform transition hover:scale-105">
                ابدأ الاختبار الآن
            </button>
        </div>

        <!-- شاشة الاختبار -->
        <div id="quiz-screen" class="glass-panel w-full max-w-4xl p-6 md:p-10 hidden-section fade-in relative">
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
                <div class="text-xl font-bold bg-white/10 px-4 py-2 rounded-lg text-gray-200">
                    السؤال: <span id="current-question-num" class="text-yellow-400">1</span> / <span id="total-questions">10</span>
                </div>
                
                <div id="motivation-text" class="hidden md:block text-xl font-bold text-green-400 text-center flex-grow mx-4">
                    توكل على الله!
                </div>

                <div class="relative flex items-center justify-center">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-circle-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="timer-circle" class="timer-circle-fg" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span id="timer-text" class="font-bold text-sm tracking-wider">30:00</span>
                    </div>
                </div>
            </div>

            <div class="min-h-[250px] flex flex-col justify-center mb-8">
                <h3 id="question-text" class="question-text text-center mb-8 text-white">
                    نص السؤال يظهر هنا
                </h3>
                <div id="options-container" class="grid grid-cols-1 gap-4 w-full max-w-2xl mx-auto">
                </div>
            </div>

            <div class="flex justify-between mt-8 pt-6 border-t border-white/10">
                <button onclick="prevQuestion()" id="prev-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition hidden text-lg">
                    السابق
                </button>
                <div class="flex-grow"></div>
                <button onclick="handleNextClick()" id="next-btn" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-12 rounded-lg transition text-xl shadow-[0_4px_15px_rgba(234,179,8,0.3)]">
                    التالي
                </button>
            </div>
        </div>

        <!-- شاشة النتيجة -->
        <div id="result-screen" class="glass-panel w-full max-w-3xl p-8 flex flex-col items-center text-center hidden-section fade-in">
            <h2 class="text-4xl font-bold mb-6" id="result-title">النتيجة النهائية</h2>
            <div class="text-2xl font-bold mb-6 text-gray-300">الطالب: <span id="display-name" class="text-yellow-400"></span></div>
            
            <div class="w-40 h-40 rounded-full flex items-center justify-center text-5xl font-black mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)] border-8" id="score-circle">
                <span id="score-text">0%</span>
            </div>

            <p id="result-message" class="text-2xl font-bold mb-8"></p>

            <div class="flex flex-col sm:flex-row gap-4 w-full justify-center flex-wrap">
                <button onclick="showReview()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition text-lg w-full sm:w-auto">
                    مراجعة الإجابات
                </button>
                <button onclick="retryQuiz()" id="retry-btn" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-8 rounded-lg transition text-lg w-full sm:w-auto">
                    إعادة الاختبار
                </button>
                <button onclick="resetAndPractice()" id="practice-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg transition text-sm w-full mt-2">
                    نسيت الدرس؟ (إعادة تعيين للتدريب)
                </button>
            </div>
        </div>

        <!-- شاشة المراجعة -->
        <div id="review-screen" class="glass-panel w-full max-w-4xl p-6 md:p-10 hidden-section fade-in">
            <h2 class="text-3xl font-bold mb-6 text-center text-yellow-400 border-b border-white/10 pb-4">مراجعة الإجابات</h2>
            <div id="review-container" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
            </div>
            <div class="mt-8 text-center border-t border-white/10 pt-6">
                <button onclick="backToResults()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-3 px-12 rounded-lg transition text-lg">
                    العودة للنتيجة
                </button>
            </div>
        </div>
    </div>

    <!-- حقوق التنفيذ -->
    <footer class="mt-auto py-4 text-center z-10 w-full">
        <p class="text-sm md:text-base text-gray-300 tracking-wide font-sans opacity-80 hover:opacity-100 transition duration-300">
            Executed by <span class="text-yellow-400 font-semibold">Abdelhalim El-Fakharany</span>
        </p>
    </footer>

    <script>
        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'select') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'next') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) { console.log("Audio not supported"); }
        }

        const PASSING_SCORE = 35;
        const MAX_ATTEMPTS = 6;
        const TIME_LIMIT = 30 * 60;
        
        // مفتاح جديد v6 لضمان بدء محاولات جديدة
        const ATTEMPTS_KEY = 'shafei_quiz_attempts_v6';
        const STATE_KEY = 'shafei_quiz_state_v6';

        const motivations = [
            "توكل على الله، أنت تستطيع!",
            "ركز جيداً، الإجابة بين يديك.",
            "استعن بالله ولا تعجز.",
            "اقرأ السؤال بتمعن، ففهم السؤال نصف الإجابة."
        ];

        // الأسئلة الجديدة في مادة التوحيد
        const questions = [
            { q: "رؤية الله تعالى أمر:", options: ["واجب", "مستحيل", "جائز وواقع"], answer: "جائز وواقع" },
            { q: "من قال بأن الزيادة في قوله تعالى: ﴿لِلَّذِينَ أَحْسَنُوا الْحُسْنَىٰ وَزِيَادَةٌ﴾ هي الرؤية هم:", options: ["المعتزلة", "جمهور المفسرين", "الفلاسفة"], answer: "جمهور المفسرين" },
            { q: "من توقف في وقوع الرؤية في الدنيا هو:", options: ["سعيد بن جبير", "ابن عباس", "الإمام أحمد"], answer: "سعيد بن جبير" },
            { q: "العقل يحكم بامتناع رؤية العباد ربهم قول:", options: ["أهل السنة", "المعتزلة", "الماتريدية"], answer: "المعتزلة" },
            { q: "تجوز رؤية الله تعالى عند:", options: ["المعتزلة", "أهل السنة", "الخوارج"], answer: "أهل السنة" },
            { q: "لم يثبت وقوع الرؤية في الدنيا لأحد من الأنبياء والمرسلين السابقين الا للنبي ﷺ.", options: ["صح", "غلط"], answer: "صح" },
            { q: "أثبتت السيدة عائشة رضي الله عنها أن النبي ﷺ رأى ربه في الدنيا.", options: ["صح", "غلط"], answer: "غلط" },
            { q: "يرى أهل السنة أن رؤية الله تعالى مستحيلة في الدنيا والآخرة.", options: ["صح", "غلط"], answer: "غلط" },
            { q: "رؤية الله تعالى لا تخضع للقوانين الطبيعية.", options: ["صح", "غلط"], answer: "صح" },
            { q: "رؤية الله منامًا غير ممكنة عقلًا.", options: ["صح", "غلط"], answer: "غلط" }
        ];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timeRemaining = TIME_LIMIT;
        let timerInterval;
        let studentName = "";
        let currentAttempts = parseInt(localStorage.getItem(ATTEMPTS_KEY)) || 0;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('total-questions').innerText = questions.length;
            checkPreviousState();
            updateAttemptsUI();
        });

        function checkPreviousState() {
            const savedState = JSON.parse(localStorage.getItem(STATE_KEY));
            if (savedState && savedState.passed) {
                studentName = savedState.name;
                document.getElementById('intro-screen').classList.add('hidden-section');
                showFinalResultUI(savedState.score, true);
            }
        }

        function updateAttemptsUI() {
            const remaining = MAX_ATTEMPTS - currentAttempts;
            const attemptsInfo = document.getElementById('attempts-info');
            
            if (currentAttempts >= MAX_ATTEMPTS) {
                attemptsInfo.innerHTML = `<span class="text-red-400">لقد استنفدت جميع محاولاتك (${MAX_ATTEMPTS}).</span>`;
                document.querySelector('button[onclick="confirmStartQuiz()"]').disabled = true;
                document.querySelector('button[onclick="confirmStartQuiz()"]').classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                attemptsInfo.innerText = `لديك ${MAX_ATTEMPTS} محاولات، المتبقي: ${remaining}`;
            }
        }

        function confirmStartQuiz() {
            playSound('select');
            const nameInput = document.getElementById('student-name').value.trim();
            if (nameInput.split(' ').length < 3) {
                playSound('error');
                Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'الرجاء إدخال اسم الطالب ثلاثي بشكل صحيح!', confirmButtonText: 'حسناً', confirmButtonColor: '#eab308' });
                return;
            }
            if (currentAttempts >= MAX_ATTEMPTS) return;

            Swal.fire({
                title: 'جاهز؟',
                text: 'سيبدأ المؤقت فور دخولك.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'نعم، ابدأ',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    playSound('next');
                    studentName = nameInput;
                    startQuizConfirmed();
                }
            });
        }

        function startQuizConfirmed() {
            try {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            } catch (err) {}

            document.getElementById('intro-screen').classList.add('hidden-section');
            document.getElementById('quiz-screen').classList.remove('hidden-section');
            
            startTimer();
            loadQuestion(0);
        }

        function startTimer() {
            const timerText = document.getElementById('timer-text');
            const timerCircle = document.getElementById('timer-circle');
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;
                timerText.innerText = `${minutes < 10 ? '0'+minutes : minutes}:${seconds < 10 ? '0'+seconds : seconds}`;

                const dashoffset = 283 - (283 * timeRemaining / TIME_LIMIT);
                timerCircle.style.strokeDashoffset = dashoffset;

                if (timeRemaining <= 60) {
                    timerCircle.style.stroke = '#ef4444';
                    timerText.classList.add('text-red-400', 'animate-pulse');
                }
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz(true);
                }
            }, 1000);
        }

        function loadQuestion(index) {
            currentQuestionIndex = index;
            const q = questions[index];
            document.getElementById('current-question-num').innerText = index + 1;
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('motivation-text').innerText = motivations[Math.floor(Math.random() * motivations.length)];

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-right p-4 rounded-lg ${userAnswers[index] === opt ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => {
                    playSound('select');
                    userAnswers[currentQuestionIndex] = opt;
                    Array.from(optionsContainer.children).forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                optionsContainer.appendChild(btn);
            });

            const prevBtn = document.getElementById('prev-btn');
            index === 0 ? prevBtn.classList.add('hidden') : prevBtn.classList.remove('hidden');

            const nextBtn = document.getElementById('next-btn');
            if (index === questions.length - 1) {
                nextBtn.innerText = 'إنهاء وتسليم';
                nextBtn.classList.replace('bg-yellow-500', 'bg-green-500');
                nextBtn.classList.replace('hover:bg-yellow-400', 'hover:bg-green-400');
                nextBtn.classList.replace('text-gray-900', 'text-white');
            } else {
                nextBtn.innerText = 'التالي';
                nextBtn.classList.replace('bg-green-500', 'bg-yellow-500');
                nextBtn.classList.replace('hover:bg-green-400', 'hover:bg-yellow-400');
                nextBtn.classList.replace('text-white', 'text-gray-900');
            }
        }

        function prevQuestion() {
            playSound('next');
            if (currentQuestionIndex > 0) loadQuestion(currentQuestionIndex - 1);
        }

        function handleNextClick() {
            if (!userAnswers[currentQuestionIndex]) {
                playSound('error');
                Swal.fire({ icon: 'warning', title: 'انتظر', text: 'يجب اختيار إجابة قبل الانتقال.', confirmButtonText: 'حسناً', confirmButtonColor: '#eab308' });
                return;
            }
            playSound('next');
            if (currentQuestionIndex < questions.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                Swal.fire({
                    title: 'تأكيد التسليم',
                    text: "هل أنت متأكد من تسليم الاختبار؟",
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#10b981',
                    cancelButtonColor: '#6b7280',
                    confirmButtonText: 'نعم، تسليم',
                    cancelButtonText: 'مراجعة'
                }).then((result) => {
                    if (result.isConfirmed) submitQuiz(false);
                });
            }
        }

        function submitQuiz(isTimeUp = false) {
            clearInterval(timerInterval);
            try {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } catch(e) {}

            currentAttempts++;
            localStorage.setItem(ATTEMPTS_KEY, currentAttempts.toString());

            let score = 0;
            questions.forEach((q, idx) => { if (userAnswers[idx] === q.answer) score++; });
            const percentage = Math.round((score / questions.length) * 100);
            
            const passed = percentage >= PASSING_SCORE;
            
            if (passed) {
                localStorage.setItem(STATE_KEY, JSON.stringify({ name: studentName, score: percentage, passed: true }));
            }

            if (isTimeUp) {
                Swal.fire({ icon: 'info', title: 'انتهى الوقت!', text: 'تم سحب الورقة آلياً.', confirmButtonText: 'عرض النتيجة' });
            }

            showFinalResultUI(percentage, passed);
        }

        function showFinalResultUI(percentage, passed) {
            document.getElementById('quiz-screen').classList.add('hidden-section');
            document.getElementById('result-screen').classList.remove('hidden-section');
            document.getElementById('display-name').innerText = studentName;
            
            const scoreCircle = document.getElementById('score-circle');
            const scoreText = document.getElementById('score-text');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const retryBtn = document.getElementById('retry-btn');
            
            if (passed) {
                retryBtn.style.display = 'none';
            } else {
                retryBtn.style.display = 'block';
                if (currentAttempts >= MAX_ATTEMPTS) {
                    retryBtn.disabled = true;
                    retryBtn.innerText = 'نفدت المحاولات';
                    retryBtn.classList.add('cursor-not-allowed', 'opacity-50');
                }
            }
            
            let currentDisplay = 0;
            const counterInterval = setInterval(() => {
                if(currentDisplay >= percentage) {
                    clearInterval(counterInterval);
                    scoreText.innerText = percentage + '%';
                } else {
                    currentDisplay++;
                    scoreText.innerText = currentDisplay + '%';
                }
            }, 20);

            if (percentage >= PASSING_SCORE) {
                playSound('next');
                scoreCircle.className = "w-40 h-40 rounded-full flex items-center justify-center text-5xl font-black mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)] border-8 border-green-500 text-green-400 bg-green-900/30";
                resultTitle.innerText = "ألف مبروك! لقد اجتزت الاختبار";
                resultTitle.classList.add('text-green-400');
                resultMessage.innerText = "عمل رائع ومجهود مميز، استمر في تفوقك يا بطل!";
                resultMessage.classList.add('text-green-300');
            } else {
                playSound('error');
                scoreCircle.className = "w-40 h-40 rounded-full flex items-center justify-center text-5xl font-black mb-6 shadow-[0_0_30px_rgba(0,0,0,0.5)] border-8 border-red-500 text-red-400 bg-red-900/30";
                resultTitle.innerText = "للأسف لم تجتز الاختبار";
                resultTitle.classList.add('text-red-400');
                resultMessage.innerText = "لا تحزن، هذه فرصة للتعلم. راجع أخطائك وحاول مرة أخرى!";
                resultMessage.classList.add('text-red-300');
            }
        }

        function resetAndPractice() {
            playSound('select');
            Swal.fire({
                title: 'إعادة تعيين وبدء تدريب جديد؟',
                text: 'سيتم مسح نتيجتك السابقة ومحاولاتك.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#eab308',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'نعم',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem(STATE_KEY);
                    localStorage.removeItem(ATTEMPTS_KEY);
                    location.reload();
                }
            });
        }

        function showReview() {
            playSound('select');
            if (userAnswers.every(ans => ans === null)) {
                Swal.fire({ icon: 'info', title: 'ملاحظة', text: 'هذه نتيجتك المحفوظة مسبقاً. للتدريب مجدداً اضغط على خيار (نسيت الدرس).', confirmButtonText: 'حسناً' });
                return;
            }

            document.getElementById('result-screen').classList.add('hidden-section');
            document.getElementById('review-screen').classList.remove('hidden-section');
            
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            questions.forEach((q, idx) => {
                const userAnswer = userAnswers[idx];
                const isCorrect = userAnswer === q.answer;
                const div = document.createElement('div');
                div.className = `p-4 rounded-lg border-2 ${isCorrect ? 'bg-green-900/30 border-green-500/50' : 'bg-red-900/30 border-red-500/50'}`;
                let html = `<h4 class="text-xl font-bold mb-2">${idx + 1}. ${q.q}</h4>
                            <div class="space-y-1 text-lg">
                            <p>إجابتك: <span class="font-bold ${isCorrect ? 'text-green-400' : 'text-red-400'}">${userAnswer || 'لم يتم الإجابة'}</span></p>`;
                if (!isCorrect) html += `<p>الإجابة الصحيحة: <span class="font-bold text-green-400">${q.answer}</span></p>`;
                html += `</div>`;
                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        function backToResults() {
            playSound('select');
            document.getElementById('review-screen').classList.add('hidden-section');
            document.getElementById('result-screen').classList.remove('hidden-section');
        }

        function retryQuiz() {
            playSound('select');
            if (currentAttempts >= MAX_ATTEMPTS) return;
            userAnswers = new Array(questions.length).fill(null);
            timeRemaining = TIME_LIMIT;
            currentQuestionIndex = 0;
            
            document.getElementById('result-screen').classList.add('hidden-section');
            
            const timerCircle = document.getElementById('timer-circle');
            timerCircle.style.stroke = '#facc15';
            document.getElementById('timer-text').classList.remove('text-red-400', 'animate-pulse');
            
            startTimer();
            loadQuestion(0);
            document.getElementById('quiz-screen').classList.remove('hidden-section');
        }
    </script>
</body>
</html>
